name: Android Build & Netlify APK Deploy

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "site/downloads/version.json"
      - "site/downloads/personal-ai-computer.apk.sha256"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & configure SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore persistent debug.keystore from debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored persistent debug.keystore from repository debug.keystore.base64"
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests & lint
        run: gradle testDebugUnitTest lintDebug

      - name: Configure release signing if secrets are present
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gradle assembleRelease -PciVersionCode=${{ github.run_number }} -PciVersionName="1.0.${{ github.run_number }}"
          else
            gradle assembleDebug -PciVersionCode=${{ github.run_number }} -PciVersionName="1.0.${{ github.run_number }}"
          fi

      - name: Verify APK, compute SHA-256 & prepare release metadata
        id: package
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            BUILD_TYPE="signed-release"
          else
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            BUILD_TYPE="debug-build"
          fi

          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: APK not found at $APK_SRC"
            exit 1
          fi

          mkdir -p site/downloads
          cp "$APK_SRC" site/downloads/personal-ai-computer.apk
          SHA256=$(sha256sum site/downloads/personal-ai-computer.apk | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s site/downloads/personal-ai-computer.apk)
          VERSION_TAG="${GITHUB_REF_NAME:-main}-${GITHUB_RUN_NUMBER}"
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="latest"
          fi
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/personal-ai-computer.apk"

          echo "$SHA256  personal-ai-computer.apk" > site/downloads/personal-ai-computer.apk.sha256

          python3 -c '
          import json, sys
          data = {
              "appName": "Personal AI Computer",
              "version": sys.argv[1],
              "buildType": sys.argv[2],
              "releaseDate": sys.argv[3],
              "apkFile": "downloads/personal-ai-computer.apk",
              "releaseDownloadUrl": sys.argv[4],
              "repo": sys.argv[7],
              "sizeBytes": int(sys.argv[5]),
              "sha256": sys.argv[6],
              "minAndroid": "Android 7.0 (API 24)",
              "changelog": [
                  "Autonomous OpenClaw-inspired Agent Engine (Bangla & English)",
                  "Local Virtual Linux Environment (sh, PyLite Python 3, V8 JS, HTTP server)",
                  "Multi-tab Chromium WebView DOM Automation & Accessibility Virtual Hands"
              ]
          }
          with open("site/downloads/version.json", "w") as f:
              json.dump(data, f, indent=2)
          ' "$VERSION_TAG" "$BUILD_TYPE" "$RELEASE_DATE" "$RELEASE_URL" "$SIZE_BYTES" "$SHA256" "$GITHUB_REPOSITORY"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-computer-apk
          path: |
            site/downloads/personal-ai-computer.apk
            site/downloads/personal-ai-computer.apk.sha256
            site/downloads/version.json

      - name: Publish APK to GitHub Release (latest or tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: Personal AI Computer (${{ steps.package.outputs.release_tag }})
          make_latest: true
          files: |
            site/downloads/personal-ai-computer.apk
            site/downloads/personal-ai-computer.apk.sha256

      - name: Deploy complete site with APK directly to Netlify (if token configured)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "./site"
          production-deploy: true
          deploy-message: "Deploy Personal AI Computer APK build #${{ github.run_number }}"

      - name: Sync version metadata to branch for Netlify Git auto-deploy
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/downloads/version.json site/downloads/personal-ai-computer.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore: update APK release metadata"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
