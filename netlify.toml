[build]
  publish = "site"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=personal-ai-computer.apk"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/downloads/version.json"
  [headers.values]
    Cache-Control = "no-cache"
